name: Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  SERVER_BIN: __SERVER_BIN__
  WITH_CLIENT: "__WITH_CLIENT__"

jobs:
  docker:
    name: Package Docker release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Prepare release metadata
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $GITHUB_REF_NAME"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md")
          if not changelog.exists():
              raise SystemExit("CHANGELOG.md not found")

          text = changelog.read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$", re.MULTILINE)
          match = heading.search(text)
          if not match:
              raise SystemExit(f"CHANGELOG version section not found: [{version}]")

          next_heading = re.search(r"^## \[.+?\]", text[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(text)
          notes = text[match.end():end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG version section is empty: [{version}]")

          (Path(os.environ["RUNNER_TEMP"]) / "RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Resolve image metadata
        id: meta
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--manifest-path", "server/Cargo.toml",
              "--no-deps", "--format-version", "1",
          ]))
          manifest = (Path.cwd() / "server" / "Cargo.toml").resolve()
          package = next(
              (item for item in metadata["packages"] if Path(item["manifest_path"]).resolve() == manifest),
              None,
          )
          if package is None:
              raise SystemExit("server/Cargo.toml package not found in cargo metadata")
          if package["version"] != version:
              raise SystemExit(f"server version must match release: {package['version']} != {version}")

          image_pattern = re.compile(r"^[a-z0-9]+(?:[._-][a-z0-9]+)*$")
          server_image = package["name"]
          if not image_pattern.fullmatch(server_image):
              raise SystemExit(f"server package name is not a valid local image name: {server_image}")

          output = Path(os.environ["GITHUB_OUTPUT"])
          targets = {
              "server": {
                  "context": "./server",
                  "dockerfile": "Dockerfile",
                  "platforms": ["linux/amd64"],
                  "tags": [f"{server_image}:{version}"],
                  "args": {"APP_BIN": os.environ["SERVER_BIN"]},
                  "cache-from": ["type=gha,scope=server"],
                  "cache-to": ["type=gha,scope=server,mode=max"],
              },
          }
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"server_image={server_image}\n")
              stream.write(f"server_tag={version}\n")
              stream.write(f"server_bin={os.environ['SERVER_BIN']}\n")
              stream.write(f"has_client={os.environ['WITH_CLIENT']}\n")

              if os.environ["WITH_CLIENT"] == "true":
                  client = json.loads(Path("client/package.json").read_text(encoding="utf-8"))
                  client_image = client.get("name", "")
                  client_version = client.get("version", "")
                  if not image_pattern.fullmatch(client_image):
                      raise SystemExit(f"client package name is not a valid local image name: {client_image}")
                  if client_version != version:
                      raise SystemExit(f"client version must match release: {client_version} != {version}")
                  stream.write(f"client_image={client_image}\n")
                  stream.write(f"client_tag={version}\n")
                  targets["client"] = {
                      "context": "./client",
                      "dockerfile": "Dockerfile",
                      "platforms": ["linux/amd64"],
                      "tags": [f"{client_image}:{version}"],
                      "cache-from": ["type=gha,scope=client"],
                      "cache-to": ["type=gha,scope=client,mode=max"],
                  }

          bake = {"group": {"default": {"targets": list(targets)}}, "target": targets}
          (Path(os.environ["RUNNER_TEMP"]) / "docker-bake.json").write_text(
              json.dumps(bake), encoding="utf-8",
          )

      - name: Create draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          draft: true
          prerelease: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ${{ runner.temp }}/docker-bake.json
          load: true

      - name: Install parallel compressor
        if: github.ref_type == 'tag'
        run: command -v pigz >/dev/null || (sudo apt-get update && sudo apt-get install -y pigz)

      - name: Prepare deploy configuration
        if: github.ref_type == 'tag'
        shell: python
        env:
          SERVER_IMAGE: ${{ steps.meta.outputs.server_image }}
          SERVER_TAG: ${{ steps.meta.outputs.server_tag }}
          CLIENT_IMAGE: ${{ steps.meta.outputs.client_image }}
          CLIENT_TAG: ${{ steps.meta.outputs.client_tag }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          deploy = Path("release/deploy")
          deploy.mkdir(parents=True, exist_ok=True)
          compose = json.loads(subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.yaml", "config",
              "--no-interpolate", "--no-path-resolution", "--no-env-resolution", "--format", "json",
          ]))
          for service in compose["services"].values():
              service.pop("build", None)
          (deploy / "docker-compose.yaml").write_text(json.dumps(compose, indent=2) + "\n", encoding="utf-8")
          example = Path(".env.example")
          if example.is_file():
              text = example.read_text(encoding="utf-8")
              for key in ("SERVER_IMAGE", "SERVER_TAG", "CLIENT_IMAGE", "CLIENT_TAG"):
                  if os.environ.get(key):
                      text = re.sub(rf"^{key}=.*$", f"{key}={os.environ[key]}", text, flags=re.MULTILINE)
              (deploy / ".env.example").write_text(text, encoding="utf-8")

      - name: Create release package
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          mkdir -p release/deploy

          if [ "${{ steps.meta.outputs.has_client }}" = "true" ]; then
            docker save -o release/deploy/docker.tar \
              "${{ steps.meta.outputs.server_image }}:${{ steps.meta.outputs.server_tag }}" \
              "${{ steps.meta.outputs.client_image }}:${{ steps.meta.outputs.client_tag }}"
          else
            docker save -o release/deploy/docker.tar \
              "${{ steps.meta.outputs.server_image }}:${{ steps.meta.outputs.server_tag }}"
          fi

          for dir in config conf pingap; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \( -name '*.example' -o -name '*.example.*' -o -name 'example.*' \) -print | while IFS= read -r file; do
              mkdir -p "release/deploy/$(dirname "$file")"
              cp "$file" "release/deploy/$file"
            done
          done

          forbidden="$(find release/deploy -type f \( -name '.env' -o -name '.env.local' -o -name '*.key' -o -name '*.pem' -o -name '*.p12' -o -name '*.crt' \) -print -quit)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden private file in release package: $forbidden"
            exit 1
          fi

          tar -I 'pigz -6' -cf "release/$PROJECT_NAME-$VERSION.tar.gz" -C release/deploy .

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: release/${{ env.PROJECT_NAME }}-${{ env.VERSION }}.tar.gz
          fail_on_unmatched_files: true
          draft: true
          prerelease: false

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
